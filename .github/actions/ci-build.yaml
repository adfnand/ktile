name: Build and test
description: Runs the ktile Gradle build and Rust library tests

runs:
  using: composite
  steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      shell: bash

    - name: Grant Linux input device permissions
      if: runner.os == 'Linux'
      run: |
        sudo modprobe uinput || true
        sudo chmod 666 /dev/uinput || true
        sudo chmod 666 /dev/input/event* 2>/dev/null || true
      shell: bash

    - name: Cache cargo registry
      if: runner.os == 'Linux'
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: lib/ktile-hotkey

    - name: Build and Test
      run: ./gradlew build --no-daemon
      shell: bash

    - name: Run Rust lib tests
      if: runner.os == 'Linux'
      working-directory: lib/ktile-hotkey
      run: cargo test
      shell: bash